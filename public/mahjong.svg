<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 투명 배경 -->
  <rect width="64" height="64" fill="none"></rect>

  <!-- 마작 패 본체 -->
  <rect x="8" y="6" width="48" height="52" rx="10" fill="#fdfcf8" stroke="#e2e8f0" stroke-width="3"></rect>

  <!-- 살짝 진한 안쪽 테두리 (작을 때도 모양 또렷하게) -->
  <rect x="13" y="11" width="38" height="42" rx="8" fill="none" stroke="#dc2626" stroke-width="2.5"></rect>

  <!-- 중앙 '中' 글자 -->
  <text x="32" y="40" text-anchor="middle" font-size="30" font-weight="700" fill="#dc2626">
    中
  </text>
</svg>
